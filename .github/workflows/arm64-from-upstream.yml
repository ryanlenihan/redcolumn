name: Windows arm64 from upstream

# Once a day, look for a new stable release tag on the upstream repo (vX.Y.Z, no suffix). If this
# fork has no release with that tag yet, build upstream's code at that tag as a native Windows on
# Arm installer and publish it as a release here.
#
# The build is pointed at this fork's releases for updates: electron-updater reads latest.yml from
# here (which describes the arm64 installer), so installed copies update themselves in place.
#
# Run it by hand (Actions > this workflow > Run workflow) to build now, or give a tag to rebuild
# one that already has a release (its files are replaced).
on:
  schedule:
    - cron: '23 20 * * *' # 06:23 Brisbane
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to build (blank = newest stable)
        required: false

env:
  UPSTREAM: ColbyGallagher/redcolumn

permissions:
  contents: read

concurrency:
  group: arm64-from-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      build: ${{ steps.pick.outputs.build }}
      exists: ${{ steps.pick.outputs.exists }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag=$(git ls-remote --tags --refs "https://github.com/$UPSTREAM" \
              | awk -F/ '{print $3}' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          fi
          [ -n "$tag" ] || { echo "No upstream tag found" >&2; exit 1; }
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exists=true; else exists=false; fi
          build=false
          if [ "$exists" = false ] || [ -n "$INPUT_TAG" ]; then build=true; fi
          echo "Upstream $tag, release here: $exists, build: $build"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "exists=$exists" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.tag }}
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      # The in-app update check and the release-page link go to this fork, not upstream (whose
      # releases have no arm64 installer). Fails if upstream has moved these lines.
      - name: Point updates at this fork
        shell: bash
        run: |
          f=apps/desktop/src/updater.ts
          grep -q "repos/$UPSTREAM/releases/latest" "$f" || { echo "updater.ts changed upstream; patch needs updating" >&2; exit 1; }
          sed -i "s#$UPSTREAM#$GITHUB_REPOSITORY#g" "$f"
          # If upstream ever turns self-update off on Arm, turn it back on: latest.yml here is arm64.
          sed -i "s# || process.arch !== 'x64'##" "$f"
          grep -n "$GITHUB_REPOSITORY" "$f"

      - run: pnpm install --frozen-lockfile

      # Each command's output goes to the log; if one fails, its last lines become annotations
      # (visible on the run page) and the job stops.
      - name: Package installer
        shell: bash
        run: |
          log="$RUNNER_TEMP/build.log"
          run() {
            echo "+ $*" | tee -a "$log"
            "$@" >> "$log" 2>&1 || { echo "::error::failed: $*"; tail -n 9 "$log" | sed 's/^/::error::/'; exit 1; }
          }
          owner="${GITHUB_REPOSITORY%%/*}"
          repo="${GITHUB_REPOSITORY##*/}"
          run pnpm --filter @nb/web build
          cd apps/desktop
          run pnpm exec tsc -p .
          # The Node download script unpacks a .zip with `tar`, which has to be Windows' own
          # bsdtar; in this bash shell `tar` would be Git's GNU tar, which cannot read zips.
          run pwsh -NoProfile -Command '$env:PATH = "$env:SystemRoot\System32;$env:PATH"; node scripts/fetch-assistant-node.mjs --arch=arm64; exit $LASTEXITCODE'
          run pnpm exec electron-builder --win --arm64 --publish never \
            -c.publish.provider=github -c.publish.owner="$owner" -c.publish.repo="$repo" \
            '-c.nsis.artifactName=redcolumn-Setup-arm64.${ext}'
          ls -la release
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          # 7-Zip picks its ARM64 branch filter for arm64 binaries, which the extractor inside the
          # NSIS installer cannot decode: the install ends up with no .exe or .dll files. Force the
          # x86 BCJ filter, which it can (it only costs a little compression on these files).
          ELECTRON_BUILDER_7Z_FILTER: BCJ
          # Public Entra client ID, same as upstream's release workflow. Not a secret.
          VITE_MICROSOFT_CLIENT_ID: b1c13541-0b78-4c60-8ca4-308aa9b23bd0

      # Nothing is published unless the packaged app has its executable, the asar and the
      # assistant's Node, all arm64.
      - name: Verify the packaged app
        shell: bash
        working-directory: apps/desktop/release/win-arm64-unpacked
        run: |
          node -e '
            const fs = require("fs");
            const want = ["redcolumn.exe", "ffmpeg.dll", "resources/assistant/node.exe"];
            let bad = 0;
            for (const f of want) {
              if (!fs.existsSync(f)) { console.log(`::error::missing ${f}`); bad++; continue; }
              const b = fs.readFileSync(f).subarray(0, 4096);
              const m = b.readUInt16LE(b.readUInt32LE(0x3c) + 4);
              const ok = m === 0xaa64;
              console.log(`${f}: machine 0x${m.toString(16)} ${ok ? "arm64" : "NOT arm64"}`);
              if (!ok) { console.log(`::error::${f} is not arm64`); bad++; }
            }
            const asar = fs.statSync("resources/app.asar").size;
            console.log(`resources/app.asar: ${asar} bytes`);
            if (asar < 100000) { console.log("::error::app.asar is too small"); bad++; }
            process.exit(bad ? 1 : 0);
          '

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-win-arm64
          path: |
            apps/desktop/release/redcolumn-Setup-arm64.exe
            apps/desktop/release/redcolumn-Setup-arm64.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer-win-arm64

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          EXISTS: ${{ needs.check.outputs.exists }}
        run: |
          files="redcolumn-Setup-arm64.exe redcolumn-Setup-arm64.exe.blockmap latest.yml"
          if [ "$EXISTS" = true ]; then
            gh release upload "$TAG" $files --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $files -R "$GITHUB_REPOSITORY" \
              --target "${{ github.event.repository.default_branch }}" \
              --title "redcolumn ${TAG#v} (Windows arm64)" \
              --notes "Native Windows on Arm build of [$UPSTREAM $TAG](https://github.com/$UPSTREAM/releases/tag/$TAG), built from upstream's code at that tag. Installed copies update themselves from this fork's releases."
          fi
